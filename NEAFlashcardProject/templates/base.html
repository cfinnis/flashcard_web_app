 <!DOCTYPE html>
<html lang="en" dir="ltr"> <!-- specifies the language as english and the text direction as left-to-right -->
 <head> <!--head section contains metadata about the html document eg. title/character set/styles etc-->
   <meta charset="utf-8">
   <title>Flask Parent Template</title> <!--the title is displayed in the browsers title bar or tab-->
   <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"> <!--links to external css stylesheet
   Flask's 'url_for' function generates the URL for the 'template.css' file located in the 'static/css' directory-->
 </head>
 <body>
    <header class="header">
      {% if g.streak_count is not none %}
        <p>Study Streak: {{ g.streak_count }}</p>
      {% endif %}
      <form action="{{ url_for('logout') }}" method="POST">
        <input type="submit" name="logout" value="Logout">
      </form>

      <form action="{{ url_for('settings') }}" method="POST">
          <input type="submit" name="settings" value="Settings">
      </form>
      <h2>Welcome back, {{name}}!</h2>
    </header>
    <div class="container"> 
      <strong><nav> <!--strong makes the enclosed text bold, nav defines a set of navigation links-->
        <section class="sidebar">
          <p class="menu"><a href="{{ url_for('study.studycards') }}">Study</a></p> <!-- a list item (li) containing a link (a) to the 'home' route generated by Flasks 'url_for' function - the link text is 'Home'-->
          <p class="menu"><a href="{{ url_for('study.manageflashcards') }}">Manage Cards</a></p>
          <p class="menu"><a href="{{ url_for('quiz.quiz') }}">Do Quiz</a></p>
          <p class="menu"><a href="{{ url_for('quiz.homework') }}">Homework</a></p>
        </section>
      </nav></strong>
    </div>

    {% block content %} <!--this defines a block named content and this is where the content from child template will go-->
    {% endblock %}

 </body>
</html>
